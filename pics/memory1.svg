<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf3ea"/>
      <stop offset="100%" stop-color="#dce6d8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#38523b" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgGrad1)"/>
  
  <!-- Decorative Floral Sprigs -->
  <g stroke="#7b9e83" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 120,400 Q 180,320 200,240"/>
    <ellipse cx="160" cy="340" rx="14" ry="7" transform="rotate(-30 160 340)" fill="#9bbba2" stroke="none"/>
    <ellipse cx="185" cy="285" rx="14" ry="7" transform="rotate(20 185 285)" fill="#9bbba2" stroke="none"/>
    
    <path d="M 380,400 Q 320,320 300,240"/>
    <ellipse cx="340" cy="340" rx="14" ry="7" transform="rotate(30 340 340)" fill="#9bbba2" stroke="none"/>
    <ellipse cx="315" cy="285" rx="14" ry="7" transform="rotate(-20 315 285)" fill="#9bbba2" stroke="none"/>
  </g>

  <!-- Cozy Coffee Cups -->
  <g filter="url(#softShadow)">
    <!-- Cup 1 -->
    <rect x="180" y="240" width="65" height="75" rx="10" fill="#ffffff"/>
    <path d="M 180,270 C 150,270 150,300 180,300" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="175" y="235" width="75" height="8" rx="4" fill="#dce6d8"/>

    <!-- Cup 2 -->
    <rect x="255" y="230" width="70" height="85" rx="12" fill="#527359"/>
    <path d="M 325,260 C 355,260 355,295 325,295" stroke="#527359" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="250" y="224" width="80" height="9" rx="4" fill="#3e5643"/>
    <path d="M 290,265 C 285,258 275,260 275,270 C 275,280 290,290 290,290 C 290,290 305,280 305,270 C 305,260 295,258 290,265 Z" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Steam Hearts -->
  <path d="M 215,210 C 210,195 220,185 212,170" stroke="#b2cbb6" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 290,195 C 285,180 295,170 288,155" stroke="#b2cbb6" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <path d="M 250,150 C 242,138 226,140 226,155 C 226,170 250,185 250,185 C 250,185 274,170 274,155 C 274,140 258,138 250,150 Z" fill="#d89d88"/>

  <!-- Caption text inside illustration -->
  <text x="250" y="420" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="600" fill="#3e5643">Our First Date &amp; Coffee</text>
  <text x="250" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#6f8873" letter-spacing="1">WHERE EVERYTHING STARTED</text>
</svg>